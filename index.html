<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Field Manual — Weekly Operations</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,500&family=Barlow:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap');

  :root{--ward:#3f6b52;--ward-bright:#5c9a76;--wr:63,107,82;}
  :root{--void:#0b0e08;--char:#141a0f;--char2:#1b2314;--blood:#6b5a2a;--blood-bright:#c9a24a;--bone:#d6d9c4;--bone-dim:#8f9578;--sigil:#a9b85c;--sigil-dim:#5f6a30;--line:#2b3320;--line2:#232a19;--tab-a:#1f2815;--tab-b:#12170c;--ar:169,184,92;--br:107,90,42;}

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:
      radial-gradient(ellipse at 20% 0%, rgba(var(--br),0.08), transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(var(--wr),0.06), transparent 60%),
      var(--void);
    color: var(--bone);
    font-family: 'Barlow',Arial,sans-serif;
    min-height: 100vh;
    padding: 24px 14px 80px;
    background-attachment: fixed;
  }

  body::before{
    content:"";
    position: fixed; inset:0;
    pointer-events:none;
    opacity:0.05;
    background-image: repeating-linear-gradient(0deg, #000 0 2px, transparent 2px 4px);
    z-index:0;
  }

  .wrap{max-width: 760px; margin: 0 auto; position:relative; z-index:1;}

  header.title-block{
    text-align:center;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--sigil-dim);
    position: relative;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    letter-spacing: 0.35em;
    font-size: 11px;
    color: var(--blood-bright);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  h1{
    font-family:'Black Ops One',Impact,sans-serif;
    font-weight: 400;
    font-size: clamp(28px, 6vw, 42px);
    color: var(--sigil);
    margin: 0 0 6px;
    text-shadow: 0 0 18px rgba(var(--ar),0.35), 0 0 2px rgba(var(--ar),0.5);
    letter-spacing: 0.03em;
  }
  .subtitle{
    font-family:'Barlow Condensed','Arial Narrow',sans-serif;
    font-style: italic;
    color: var(--bone-dim);
    font-size: 14px;
  }

  .sigil-divider{
    text-align:center; color: var(--sigil-dim); font-size: 18px; margin: 8px 0 18px; letter-spacing: 12px;
  }

  /* Week nav */
  .week-nav{
    display:flex; gap:6px; overflow-x:auto; padding-bottom: 6px; margin-bottom: 20px;
    scrollbar-width: thin;
  }
  .day-tab{
    flex: 0 0 auto;
    font-family:'Barlow Condensed','Arial Narrow',sans-serif;
    font-weight:600;
    font-size: 12.5px;
    letter-spacing: 0.05em;
    padding: 10px 14px;
    background: var(--char);
    border: 1px solid var(--line);
    color: var(--bone-dim);
    cursor:pointer;
    text-transform: uppercase;
    position:relative;
    transition: all .2s ease;
  }
  .day-tab .roman{
    display:block; font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--sigil-dim); letter-spacing:2px; margin-bottom:3px;
  }
  .day-tab.active{
    background: linear-gradient(180deg, var(--tab-a), var(--tab-b));
    border-color: var(--sigil);
    color: var(--sigil);
    box-shadow: 0 0 12px rgba(var(--ar),0.15) inset, 0 2px 8px rgba(0,0,0,0.5);
  }
  .day-tab.complete::after{
    content:"✓";
    position:absolute; top:2px; right:4px;
    color: var(--ward-bright);
    font-size:10px;
  }
  .day-tab:hover{ color: var(--bone); border-color: var(--sigil-dim); }

  /* Day panel */
  .panel{ display:none; }
  .panel.active{ display:block; animation: fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform: translateY(6px);} to{opacity:1; transform:none;} }

  .day-header{
    background: linear-gradient(135deg, rgba(var(--br),0.12), rgba(0,0,0,0));
    border: 1px solid var(--blood);
    border-left: 3px solid var(--blood-bright);
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .day-header h2{
    font-family:'Black Ops One',Impact,sans-serif;
    color: var(--bone);
    font-size: 22px;
    margin: 0 0 4px;
  }
  .day-header .flavor{
    font-style: italic;
    color: var(--bone-dim);
    font-size: 14.5px;
    line-height:1.5;
  }
  .day-header .meta{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--sigil);
    margin-top: 10px;
    letter-spacing: 0.03em;
  }

  .progress-bar{
    height: 6px;
    background: var(--char2);
    border: 1px solid var(--line);
    margin: 12px 0 0;
    position:relative;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--blood), var(--sigil));
    width:0%;
    transition: width .4s ease;
    box-shadow: 0 0 8px rgba(var(--ar),0.5);
  }

  /* Difficulty selector */
  .diff-selector{
    display:flex;
    gap:0;
    margin-bottom: 18px;
    border: 1px solid var(--sigil-dim);
    background: var(--char);
  }
  .diff-btn{
    flex:1;
    text-align:center;
    padding: 10px 6px;
    font-family:'Barlow Condensed','Arial Narrow',sans-serif;
    font-size: 12px;
    letter-spacing:0.06em;
    text-transform: uppercase;
    color: var(--bone-dim);
    cursor:pointer;
    border-right: 1px solid var(--sigil-dim);
    transition: all .2s ease;
    position:relative;
  }
  .diff-btn:last-child{ border-right:none; }
  .diff-btn .rank{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size: 9px;
    color: var(--sigil-dim);
    margin-top:2px;
    letter-spacing:0.05em;
  }
  .diff-btn.active{
    background: linear-gradient(180deg, rgba(var(--ar),0.15), transparent);
    color: var(--sigil);
  }
  .diff-btn.active.easy{ box-shadow: inset 0 -2px 0 var(--ward-bright); }
  .diff-btn.active.normal{ box-shadow: inset 0 -2px 0 var(--sigil); }
  .diff-btn.active.hard{ box-shadow: inset 0 -2px 0 var(--blood-bright); }
  .diff-btn.active.special{ box-shadow: inset 0 -2px 0 var(--blood-bright), inset 0 -5px 0 var(--sigil); }
  .diff-btn:hover{ color: var(--bone); }

  .section-label{
    font-family:'Barlow Condensed','Arial Narrow',sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-size: 12px;
    color: var(--sigil-dim);
    margin: 22px 0 4px;
    display:flex; align-items:center; gap:10px;
  }
  .section-label::after{
    content:""; flex:1; height:1px; background: var(--sigil-dim); opacity:0.4;
  }
  .section-sigil{
    flex: 0 0 auto;
    width: 22px; height: 22px;
    display:flex; align-items:center; justify-content:center;
    color: var(--sigil);
    opacity: 0.9;
  }
  .section-sigil svg{ width:100%; height:100%; display:block; }
  .section-lore{
    font-style: italic;
    font-size: 13px;
    color: var(--bone-dim);
    margin: 0 0 10px;
    line-height: 1.5;
    opacity: 0.85;
    border-left: 2px solid var(--sigil-dim);
    padding-left: 10px;
  }

  .exercise{
    background: var(--char);
    border: 1px solid var(--line2);
    margin-bottom: 8px;
    transition: border-color .2s ease;
  }
  .exercise.done{
    border-color: var(--ward);
    background: linear-gradient(135deg, rgba(var(--wr),0.08), var(--char));
  }
  .ex-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding: 12px 14px;
    cursor:pointer;
  }
  .checkbox{
    flex: 0 0 auto;
    width: 22px; height: 22px;
    border: 1.5px solid var(--sigil-dim);
    background: var(--void);
    display:flex; align-items:center; justify-content:center;
    font-size: 14px;
    color: var(--ward-bright);
    cursor:pointer;
    transition: all .15s ease;
  }
  .checkbox:hover{ border-color: var(--sigil); }
  .exercise.done .checkbox{
    background: var(--ward); border-color: var(--ward-bright); color: var(--void);
  }
  .ex-name{
    flex:1;
    font-family:'Barlow Condensed','Arial Narrow',sans-serif;
    font-size: 15px;
    color: var(--bone);
    letter-spacing: 0.01em;
  }
  .exercise.done .ex-name{ color: var(--bone-dim); text-decoration: line-through; text-decoration-color: var(--ward); }
  .ex-specs{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--sigil);
    white-space: nowrap;
  }
  .expand-arrow{
    color: var(--sigil-dim);
    font-size: 11px;
    transition: transform .2s ease;
    flex: 0 0 auto;
  }
  .exercise.open .expand-arrow{ transform: rotate(90deg); }

  .ex-details{
    display:none;
    padding: 4px 16px 18px 48px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--bone-dim);
    border-top: 1px dashed var(--line2);
  }
  .exercise.open .ex-details{ display:block; }
  .ex-details h4{
    font-family:'Barlow Condensed','Arial Narrow',sans-serif;
    color: var(--sigil);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 12px 0 4px;
  }
  .ex-details h4:first-child{ margin-top: 10px; }
  .ex-details .avoid{ color: #c98686; }
  .ex-details ul{ margin: 4px 0; padding-left: 18px; }
  .rest-note{
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--sigil-dim);
    margin-top: 8px;
  }

  .log-block{
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed var(--line2);
  }
  .log-row{
    display:flex; gap: 10px; align-items:center; margin-top: 6px;
  }
  .log-field{
    display:flex; flex-direction:column; gap:3px; flex:1;
  }
  .log-field label{
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    color: var(--sigil-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .log-field input{
    background: var(--void);
    border: 1px solid var(--sigil-dim);
    color: var(--bone);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 6px 8px;
    width: 100%;
    outline: none;
  }
  .log-field input:focus{ border-color: var(--sigil); }
  .log-field input::placeholder{ color: var(--sigil-dim); }
  .log-saved-hint{
    font-family:'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--ward-bright);
    margin-top: 4px;
    height: 12px;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .log-saved-hint.show{ opacity: 1; }

  .cardio-block{
    background: linear-gradient(135deg, rgba(var(--ar),0.08), var(--char));
    border: 1px solid var(--sigil-dim);
    padding: 16px;
    margin-top: 16px;
  }
  .cardio-block h3{
    font-family:'Black Ops One',Impact,sans-serif;
    color: var(--sigil);
    font-size: 16px;
    margin: 0 0 6px;
  }
  .cardio-block p{ margin: 4px 0; font-size: 14px; color: var(--bone-dim); }
  .cardio-block .target{ font-family:'JetBrains Mono', monospace; color: var(--blood-bright); font-size: 13px; }

  .benchmark-grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr));
    gap: 8px; margin-top: 14px;
  }
  .benchmark{
    background: var(--void);
    border: 1px solid var(--sigil-dim);
    padding: 10px 12px;
    text-align:center;
  }
  .benchmark .num{ font-family:'Black Ops One',Impact,sans-serif; color:var(--sigil); font-size:20px; display:block;}
  .benchmark .lbl{ font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--bone-dim); text-transform:uppercase; letter-spacing:0.05em;}

  .rest-day{
    text-align:center; padding: 40px 20px;
  }
  .rest-day .sigil-big{ font-size: 48px; color: var(--sigil-dim); margin-bottom:16px; }
  .rest-day h2{ font-family:'Black Ops One',Impact,sans-serif; color:var(--bone); font-size:26px; }
  .rest-day p{ color: var(--bone-dim); font-size:15px; line-height:1.7; max-width: 460px; margin: 10px auto; font-style:italic; }
  .rest-checklist{ text-align:left; max-width:320px; margin: 20px auto 0; }

  .warmup-block{
    background: var(--char2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--ward);
    padding: 12px 14px;
    margin-bottom: 18px;
    font-size: 13.5px;
    color: var(--bone-dim);
  }
  .warmup-block h3{
    font-family:'Barlow Condensed','Arial Narrow',sans-serif;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ward-bright);
    margin: 0 0 6px;
  }
  .warmup-block ul{ margin: 4px 0 0; padding-left: 18px; }

  .reset-row{
    text-align:center; margin-top: 30px; padding-top:16px; border-top:1px solid var(--line2);
  }
  .reset-btn{
    font-family:'JetBrains Mono',monospace;
    font-size: 11px;
    background: none;
    border: 1px solid var(--blood);
    color: var(--blood-bright);
    padding: 8px 16px;
    cursor:pointer;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .reset-btn:hover{ background: var(--blood); color: var(--bone); }

  .sched-row{ display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:16px; text-align:center; }
  .sched-btn{
    font-family:'JetBrains Mono',monospace; font-size:11px; background:var(--char); border:1px solid var(--sigil);
    color:var(--sigil); padding:9px 18px; cursor:pointer; letter-spacing:0.05em; text-transform:uppercase;
  }
  .sched-btn:hover{ background:var(--sigil); color:var(--void); }
  .graph-block{ margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); }
  .graph-block h4{ margin-top:0; }
  .graph-tabs{ display:flex; gap:6px; margin-bottom:8px; }
  .graph-tab{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; background:var(--char2); color:var(--bone-dim); border:1px solid var(--line); padding:5px 12px; cursor:pointer; }
  .graph-tab.on{ color:var(--sigil); border-color:var(--sigil); }
  .graph-box svg{ width:100%; height:auto; display:block; background:var(--char); border:1px solid var(--line); }
  .g-grid{ stroke:var(--line); stroke-width:1; }
  .g-line{ fill:none; stroke:var(--sigil); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .g-dot{ fill:var(--blood-bright); stroke:var(--sigil); stroke-width:1.2; }
  .g-txt{ fill:var(--bone-dim); font-family:'JetBrains Mono',monospace; font-size:9px; }
  .graph-sum{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--bone-dim); margin-top:6px; letter-spacing:.03em; line-height:1.5; }
  .graph-empty{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--bone-dim); line-height:1.5; padding:10px; border:1px dashed var(--line); }
  .day-reset-row{ text-align:center; margin-top:26px; padding-top:14px; border-top:1px solid var(--line2); }
  .backup-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:14px; }
  .backup-msg{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--bone-dim); letter-spacing:0.04em; min-height:16px; margin-bottom:12px; }
  .sched-note{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--bone-dim); letter-spacing:0.04em; line-height:1.5; }

  footer.foot{
    text-align:center; margin-top: 40px; color: var(--sigil-dim); font-family:'JetBrains Mono',monospace; font-size: 10px; letter-spacing:0.1em;
  }

  ::-webkit-scrollbar{ height:6px; width:6px; }
  ::-webkit-scrollbar-thumb{ background: var(--sigil-dim); }
  ::-webkit-scrollbar-track{ background: var(--char); }

  body[data-branch="army"]{--void:#0b0e08;--char:#141a0f;--char2:#1b2314;--blood:#6b5a2a;--blood-bright:#c9a24a;--bone:#d6d9c4;--bone-dim:#8f9578;--sigil:#a9b85c;--sigil-dim:#5f6a30;--line:#2b3320;--line2:#232a19;--tab-a:#1f2815;--tab-b:#12170c;--ar:169,184,92;--br:107,90,42;}
  body[data-branch="marines"]{--void:#0d0707;--char:#1a0f0f;--char2:#241414;--blood:#8a1c1c;--blood-bright:#d63030;--bone:#ece3d0;--bone-dim:#a08f85;--sigil:#e0b43c;--sigil-dim:#7a6224;--line:#3a2020;--line2:#2e1a1a;--tab-a:#2a1414;--tab-b:#170b0b;--ar:224,180,60;--br:138,28,28;}
  body[data-branch="navy"]{--void:#060b14;--char:#0d1626;--char2:#131f36;--blood:#1c4f9c;--blood-bright:#4c8ee8;--bone:#e4ebf5;--bone-dim:#8b9ab3;--sigil:#e6edf7;--sigil-dim:#52678a;--line:#1f2f4d;--line2:#192740;--tab-a:#14223c;--tab-b:#0a1220;--ar:230,237,247;--br:28,79,156;}
  body[data-branch="paras"]{--void:#0a0709;--char:#171015;--char2:#20161c;--blood:#6e1a35;--blood-bright:#b02e55;--bone:#e6dfe3;--bone-dim:#9a8a94;--sigil:#e3cf9a;--sigil-dim:#7a6c45;--line:#36202b;--line2:#2b1a23;--tab-a:#24141c;--tab-b:#130a0f;--ar:227,207,154;--br:110,26,53;}
  body[data-branch="airforce"]{--void:#070b0f;--char:#101820;--char2:#16212b;--blood:#8a3f12;--blood-bright:#e8782e;--bone:#e2e9ef;--bone-dim:#8798a6;--sigil:#5cc8e8;--sigil-dim:#2f6b80;--line:#1f3040;--line2:#19283a;--tab-a:#14222d;--tab-b:#0a131a;--ar:92,200,232;--br:138,63,18;}
  body[data-branch="specops"]{--void:#050505;--char:#101010;--char2:#171717;--blood:#5c1010;--blood-bright:#c0262d;--bone:#d4d4d4;--bone-dim:#858585;--sigil:#c9a66b;--sigil-dim:#6b5a38;--line:#2a2a2a;--line2:#222222;--tab-a:#1a1a1a;--tab-b:#0c0c0c;--ar:201,166,107;--br:92,16,16;}
  body[data-branch="medical"]{--void:#080c0c;--char:#121a1a;--char2:#182222;--blood:#8a1c28;--blood-bright:#e04050;--bone:#e6efee;--bone-dim:#8aa09e;--sigil:#5fd0c0;--sigil-dim:#2f6b64;--line:#1f3331;--line2:#1a2b29;--tab-a:#14221f;--tab-b:#0a1412;--ar:95,208,192;--br:138,28,40;}
  .day-tab[data-day="mon"]{--tc:#a9b85c;}.day-tab[data-day="tue"]{--tc:#e0b43c;}.day-tab[data-day="wed"]{--tc:#e6edf7;}.day-tab[data-day="thu"]{--tc:#e3cf9a;}.day-tab[data-day="fri"]{--tc:#5cc8e8;}.day-tab[data-day="sat"]{--tc:#c9a66b;}.day-tab[data-day="sun"]{--tc:#5fd0c0;}
  .day-tab{ border-bottom:2px solid var(--tc, var(--line)); }
  header.title-block{ border-bottom:none; }
  header.title-block::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:5px; background:repeating-linear-gradient(135deg,var(--sigil) 0 8px,var(--blood) 8px 16px); opacity:.85; }
  .ex-name{ font-size:17px; font-weight:600; letter-spacing:.02em; }
  .day-header h2,.cardio-block h3,.rest-day h2{ font-weight:400; letter-spacing:.04em; }
  .section-label{ font-size:13.5px; } .day-tab{ font-size:14px; }
  .section-lore,.day-header .flavor{ font-size:15px; }

  .diff-btn{ letter-spacing:.03em; }
  .bonus-block{ display:none; padding:10px 12px 12px; border-top:1px dashed var(--sigil-dim); background:rgba(var(--br),0.10); }
  .exercise.done .bonus-block{ display:block; }
  .bonus-title{ font-family:'Barlow Condensed','Arial Narrow',sans-serif; font-size:14px; letter-spacing:.1em; text-transform:uppercase; color:var(--blood-bright); margin-bottom:8px; }
  .bonus-sum{ color:var(--bone-dim); letter-spacing:.03em; text-transform:none; font-size:13px; margin-left:6px; }
  .bonus-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .bonus-name{ font-family:'Barlow Condensed','Arial Narrow',sans-serif; font-size:16px; color:var(--bone); }
  .bonus-pill{ min-width:46px; padding:9px 0; background:var(--char2); color:var(--bone-dim); border:1px solid var(--sigil-dim); font-family:'JetBrains Mono',monospace; font-size:13px; cursor:pointer; }
  .bonus-pill.on{ background:var(--blood); border-color:var(--blood-bright); color:var(--bone); box-shadow:0 0 0 1px var(--blood-bright) inset; }
  .drill-name{ flex:1; line-height:1.25; }
  .drill-name small{ display:block; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--bone-dim); letter-spacing:.03em; margin-top:2px; }
  .drill-pill{ min-width:64px; }
</style>

  const l = sectionLabel.toLowerCase();
  if(l.includes('forearm') || l.includes('grip')) return SIGILS.grip;

  if(l.includes('tricep')) return SIGILS.triceps;

  if(l.includes('ab') || l.includes('core') || l.includes('sealing')) return SIGILS.abs;
  if(l.includes('hamstring') || l.includes('calv')) return SIGILS.hamstring;
  if(l.includes('leg') || l.includes('quad') || l.includes('glute')) return SIGILS.legs;
  if(l.includes('stretch')) return SIGILS.stretch;
  if(l.includes('compound') || l.includes('functional')) return SIGILS.strength;
  if(l.includes('grinder')) return SIGILS.grinder;
  return SIGILS.strength;
}

const HIST_KEY = "field_manual_history_v1";
let histState = loadJSON(HIST_KEY, {}); // per-exercise history: {logKey: {YYYY-MM-DD: {w, r}}}
function saveHist(){ try{ localStorage.setItem(HIST_KEY, JSON.stringify(histState)); }catch(e){} }
function todayStr(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function fmtDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function recordHist(dayKey, diff, name){
  const k = logKey(dayKey, diff, name);
  const l = logState[k] || {};
  const w = parseFloat(String(l.weight).replace(',','.'));
  const r = parseInt(l.reps, 10);
  const date = todayStr();
  if(isNaN(w) && isNaN(r)){
    if(histState[k]){ delete histState[k][date]; if(!Object.keys(histState[k]).length) delete histState[k]; }
  } else {
    (histState[k] = histState[k] || {})[date] = {w: isNaN(w) ? null : w, r: isNaN(r) ? null : r};
  }
  saveHist();
}
function drawGraph(box, key, metric){
  const h = histState[key] || {};
  const pts = Object.keys(h).sort().map(d=>({d, v:h[d][metric]})).filter(p=> typeof p.v === 'number' && !isNaN(p.v)).slice(-12);
  if(!pts.length){
    box.innerHTML = '<div class="graph-empty">No history yet. Log this exercise on a few different days and your trend shows up here.</div>';
    return;
  }
  const W=300, H=130, L=34, R=12, T=12, B=24;
  const rawMin = Math.min(...pts.map(p=>p.v)), rawMax = Math.max(...pts.map(p=>p.v));
  let min = rawMin, max = rawMax;
  if(min === max){ min -= 1; max += 1; }
  const pad = (max-min)*0.12; min -= pad; max += pad;
  if(rawMin >= 0 && min < 0) min = 0;
  const n = pts.length;
  const xAt = i => n === 1 ? (L + W - R)/2 : L + i*(W-L-R)/(n-1);
  const yAt = v => T + (max - v)/(max - min)*(H - T - B);
  const fmt = v => String(Number(v.toFixed(1)));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress graph">`;
  [min, (min+max)/2, max].forEach(v=>{
    const y = yAt(v);
    svg += `<line class="g-grid" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text class="g-txt" x="${L-4}" y="${y+3}" text-anchor="end">${fmt(v)}</text>`;
  });
  if(n > 1) svg += `<polyline class="g-line" points="${pts.map((p,i)=> xAt(i)+','+yAt(p.v)).join(' ')}"/>`;
  pts.forEach((p,i)=>{ svg += `<circle class="g-dot" cx="${xAt(i)}" cy="${yAt(p.v)}" r="3.5"><title>${fmtDate(p.d)}: ${fmt(p.v)}</title></circle>`; });
  svg += `<text class="g-txt" x="${n===1 ? xAt(0) : L}" y="${H-8}" text-anchor="${n===1 ? 'middle' : 'start'}">${fmtDate(pts[0].d)}</text>`;
  if(n > 1) svg += `<text class="g-txt" x="${W-R}" y="${H-8}" text-anchor="end">${fmtDate(pts[n-1].d)}</text>`;
  svg += '</svg>';
  const vals = pts.map(p=>p.v), last = vals[n-1], change = last - vals[0];
  let sum = `Best ${fmt(Math.max(...vals))} · Latest ${fmt(last)}`;
  if(n > 1) sum += ` · ${change >= 0 ? '+' : ''}${fmt(change)} since ${fmtDate(pts[0].d)}`;
  box.innerHTML = svg + `<div class="graph-sum">${sum}</div>`;
}
function resetDay(dayKey){
  const pre = dayKey + '::';
  Object.keys(state).forEach(k=>{ if(k.startsWith(pre)) delete state[k]; });
  Object.keys(chalState).forEach(k=>{ if(k.startsWith(pre)) delete chalState[k]; });
  saveState(); saveChal();
}

function loadJSON(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function saveDiff(){ try{ localStorage.setItem(DIFF_KEY, JSON.stringify(diffState)); }catch(e){} }
function saveLog(){ try{ localStorage.setItem(LOG_KEY, JSON.stringify(logState)); }catch(e){} }

function getDiff(dayKey){ const d = diffState[dayKey]; return DIFF_ORDER.includes(d) ? d : "normal"; }
function setDiff(dayKey, level){ diffState[dayKey] = level; saveDiff(); }

function logKey(dayKey, diff, exName){ return dayKey + "::" + diff + "::" + exName; }
function getLog(dayKey, diff, exName){
  return logState[logKey(dayKey,diff,exName)] || {weight:"", reps:""};
}
function setLog(dayKey, diff, exName, field, value){
  const k = logKey(dayKey,diff,exName);
  if(!logState[k]) logState[k] = {weight:"", reps:""};
  logState[k][field] = value;
  saveLog();
}

function exKey(dayKey, diff, exName){ return dayKey + "::" + diff + "::" + exName; }
function isDone(dayKey, diff, exName){ return !!(state[exKey(dayKey, diff, exName)]); }
function toggleDone(dayKey, diff, exName){
  const k = exKey(dayKey, diff, exName);
  state[k] = !state[k];
  saveState();
}

function daySections(dayKey){
  const day = DATA[dayKey];
  if(day.rest) return [];
  return day.sectionsByDiff[getDiff(dayKey)];
}

function countDayProgress(dayKey){
  const day = DATA[dayKey];
  if(day.rest) return {done:0,total:0};
  const secs = daySections(dayKey);
  let total=0, done=0;
  secs.forEach(sec=> sec.exercises.forEach(exr=>{
    total++;
    if(isDone(dayKey, getDiff(dayKey), exr.name)) done++;
  }));
  return {done,total};
}

/* ============================================================
   RENDER
   ============================================================ */

function buildNav(){
  const nav = document.getElementById('weekNav');
  nav.innerHTML = '';
  WEEKDAYS.forEach(wd=>{
    const dk = SCHEDULE[wd.slot];
    const day = DATA[dk];
    const btn = document.createElement('div');
    btn.className = 'day-tab';
    btn.dataset.day = dk;
    const prog = countDayProgress(dk);
    if(prog.total>0 && prog.done===prog.total) btn.classList.add('complete');
    btn.innerHTML = `<span class="roman">${MIL[dk].glyph} ${wd.roman}</span>${wd.label}`;
    btn.addEventListener('click', ()=> selectDay(dk));
    nav.appendChild(btn);
  });
}

function renderExercise(dayKey, diff, exr){
  const done = isDone(dayKey, diff, exr.name);
  const log = getLog(dayKey, diff, exr.name);
  const el = document.createElement('div');
  el.className = 'exercise' + (done ? ' done':'');
  el.innerHTML = `
    <div class="ex-row">
      <div class="checkbox">${done?'✓':''}</div>
      <div class="ex-name">${exr.name}</div>
      <div class="ex-specs">${exr.specs}</div>
      <div class="expand-arrow">▶</div>
    </div>
    <div class="ex-details">
      <h4>How to Perform</h4>
      <ul>${exr.how.map(h=>`<li>${h}</li>`).join('')}</ul>
      <h4>Avoid</h4>
      <p class="avoid">${exr.avoid}</p>
      <div class="log-block">
        <h4 style="margin-top:0;">Log This Working</h4>
        <div class="log-row">
          <div class="log-field">
            <label>Weight (kg/lb)</label>
            <input type="text" inputmode="decimal" class="log-weight" placeholder="e.g. 12.5" value="${log.weight}">
          </div>
          <div class="log-field">
            <label>Reps Achieved</label>
            <input type="text" inputmode="numeric" class="log-reps" placeholder="e.g. 12" value="${log.reps}">
          </div>
        </div>
        <div class="log-saved-hint">Logged in the field manual.</div>
      </div>
      <div class="graph-block">
        <h4>Progress</h4>
        <div class="graph-tabs">
          <button type="button" class="graph-tab on" data-m="w">Weight</button>
          <button type="button" class="graph-tab" data-m="r">Reps</button>
        </div>
        <div class="graph-box"></div>
      </div>
    </div>
  `;
  const checkbox = el.querySelector('.checkbox');
  const row = el.querySelector('.ex-row');
  const weightInput = el.querySelector('.log-weight');
  const repsInput = el.querySelector('.log-reps');
  const savedHint = el.querySelector('.log-saved-hint');

  checkbox.addEventListener('click', (e)=>{
    e.stopPropagation();
    toggleDone(dayKey, diff, exr.name);
    refreshDay(dayKey);
  });

  row.addEventListener('click', (e)=>{
    if(e.target === checkbox) return;
    el.classList.toggle('open');
  });

  function flashSaved(){
    savedHint.classList.add('show');
    clearTimeout(savedHint._t);
    savedHint._t = setTimeout(()=> savedHint.classList.remove('show'), 1400);
  }

  weightInput.addEventListener('click', (e)=> e.stopPropagation());
  repsInput.addEventListener('click', (e)=> e.stopPropagation());
  const gbox = el.querySelector('.graph-box');
  const gkey = logKey(dayKey, diff, exr.name);
  let gmetric = 'w';
  const paintGraph = ()=> drawGraph(gbox, gkey, gmetric);
  el.querySelectorAll('.graph-tab').forEach(tb=>{
    tb.addEventListener('click', (e)=>{
      e.stopPropagation();
      gmetric = tb.dataset.m;
      el.querySelectorAll('.graph-tab').forEach(x=> x.classList.toggle('on', x === tb));
      paintGraph();
    });
  });
  paintGraph();

  weightInput.addEventListener('input', ()=>{
    setLog(dayKey, diff, exr.name, 'weight', weightInput.value);
    recordHist(dayKey, diff, exr.name);
    paintGraph();
    flashSaved();
  });
  repsInput.addEventListener('input', ()=>{
    setLog(dayKey, diff, exr.name, 'reps', repsInput.value);
    recordHist(dayKey, diff, exr.name);
    paintGraph();
    flashSaved();
  });

  const tc = TIER_CHALLENGE[diff];
  if(tc){
    const ck = exKey(dayKey, diff, exr.name);
    const wrap = document.createElement('div');
    wrap.className = 'bonus-block';
    const drills = [
      {k:'circuit', label: `${tc.pushups} push-ups · ${tc.situps} sit-ups · ${tc.pullups} pull-ups · ${tc.burpees} burpees`, sub:'in 2 minutes'},
      ...(tc.hang ? [{k:'hang', label:'Dead hang', sub:`for ${tc.hang} minutes`}] : []),
      {k:'run', label: `Run ${String(tc.run).replace('.', ',')} km`, sub:'in 12 minutes'}
    ];
    wrap.innerHTML = '<div class="bonus-title">Drill Standard <span class="bonus-sum"></span></div>' +
      drills.map(d => `<div class="bonus-row"><span class="bonus-name drill-name">${d.label}<small>${d.sub}</small></span><button type="button" class="bonus-pill drill-pill" data-k="${d.k}">Done</button></div>`).join('');
    const sumEl = wrap.querySelector('.bonus-sum');
    const paint = ()=>{
      const cur = chalState[ck] || {};
      wrap.querySelectorAll('.drill-pill').forEach(b=>{
        const on = !!cur[b.dataset.k];
        b.classList.toggle('on', on);
        b.textContent = on ? '✓' : 'Done';
      });
      const n = drills.filter(d=>cur[d.k]).length;
      sumEl.textContent = '(' + n + '/' + drills.length + ')';
    };
    wrap.addEventListener('click', (e)=>{
      const b = e.target.closest('.drill-pill'); if(!b) return;
      const cur = chalState[ck] = chalState[ck] || {};
      cur[b.dataset.k] = !cur[b.dataset.k];
      saveChal(); paint();
    });
    paint();
    el.appendChild(wrap);
  }

  return el;
}

function renderDiffSelector(dayKey){
  const wrap = document.createElement('div');
  wrap.className = 'diff-selector';
  const current = getDiff(dayKey);
  DIFF_ORDER.forEach(level=>{
    const btn = document.createElement('div');
    btn.className = 'diff-btn ' + level + (level===current ? ' active':'');
    btn.innerHTML = `${DIFF_LABELS[level]}<span class="rank">${({easy:'I',normal:'II',hard:'III',special:'IV'})[level]}</span>`;
    btn.addEventListener('click', ()=>{
      setDiff(dayKey, level);
      refreshDay(dayKey);
    });
    wrap.appendChild(btn);
  });
  return wrap;
}

function dayResetRow(dayKey){
  const row = document.createElement('div');
  row.className = 'day-reset-row';
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'reset-btn';
  b.textContent = 'Reset This Day';
  b.addEventListener('click', ()=>{
    if(!confirm('Clear all checkmarks and drill checks for "' + DATA[dayKey].name + '"? Your logged weights and progress history stay.')) return;
    resetDay(dayKey);
    refreshDay(dayKey);
    if(dayKey === 'sun') buildRestChecklist();
  });
  row.appendChild(b);
  return row;
}

function renderDay(dayKey){
  const day = DATA[dayKey];
  const container = document.createElement('div');
  container.className = 'panel';
  container.dataset.day = dayKey;

  if(day.rest){
    container.innerHTML = `
      <div class="day-header">
        <h2>${day.name}</h2>
        <div class="flavor">${day.flavor}</div>
        <div class="meta">${day.metaBase}</div>
      </div>
      <div class="rest-day">
        <div class="sigil-big">✚</div>
        <h2>Stand Down</h2>
        <p>No lifting today. Muscle rebuilds off the clock, and recovery is part of the mission plan. Watch your shows, play your games, eat well, sleep well.</p>
        <p style="font-size:12px; color:var(--sigil-dim); font-family:'JetBrains Mono',monospace; font-style:normal; letter-spacing:0.05em; margin-top:18px;">TAP AN ITEM BELOW FOR ITS BRIEFING</p>
        <div class="rest-checklist" id="restChecklist"></div>
      </div>
    `;
    container.appendChild(dayResetRow(dayKey));
    return container;
  }

  const diff = getDiff(dayKey);
  const prog = countDayProgress(dayKey);
  const pct = prog.total ? Math.round((prog.done/prog.total)*100) : 0;

  const header = document.createElement('div');
  header.className = 'day-header';
  header.innerHTML = `
    <h2>${day.name}</h2>
    <div class="flavor">${day.flavor}</div>
    <div class="meta">${day.metaBase} — ${prog.done}/${prog.total} completed [${DIFF_LABELS[diff]}]</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
  `;
  container.appendChild(header);

  container.appendChild(renderDiffSelector(dayKey));

  if(day.warmup){
    const w = document.createElement('div');
    w.className = 'warmup-block';
    w.innerHTML = `<h3>Before You Begin — Warm-up</h3><ul>${day.warmup.map(l=>`<li>${l}</li>`).join('')}</ul>`;
    container.appendChild(w);
  }

  const secs = day.sectionsByDiff[diff];
  secs.forEach((sec, si)=>{
    const label = document.createElement('div');
    label.className = 'section-label';
    label.innerHTML = `<span class="section-sigil">${sigilFor(sec.label)}</span><span>${sec.label}</span>`;
    container.appendChild(label);

    if(sec.lore){
      const lore = document.createElement('div');
      lore.className = 'section-lore';
      lore.textContent = ((MIL[dayKey].lore||[])[si]) || sec.lore;
      container.appendChild(lore);
    }

    sec.exercises.forEach(exr=>{
      container.appendChild(renderExercise(dayKey, diff, exr));
    });
  });

  if(day.cardio){
    const c = document.createElement('div');
    c.className = 'cardio-block';
    c.innerHTML = `
      <h3>${day.cardio.title}</h3>
      ${day.cardio.lines.map(l=>`<p>${l}</p>`).join('')}
      <p class="target">${day.cardio.target}</p>
    `;
    container.appendChild(c);
  }

  if(day.benchmarks){
    const b = document.createElement('div');
    b.className = 'cardio-block';
    b.innerHTML = `<h3>${day.benchmarks.title}</h3>
      <div class="benchmark-grid">
        ${day.benchmarks.items.map(i=>`<div class="benchmark"><span class="num">${i.num}</span><span class="lbl">${i.lbl}</span></div>`).join('')}
      </div>`;
    container.appendChild(b);
  }

  container.appendChild(dayResetRow(dayKey));
  return container;
}

function refreshDay(dayKey){
  const panels = document.getElementById('panels');
  const old = panels.querySelector(`.panel[data-day="${dayKey}"]`);
  const wasActive = old && old.classList.contains('active');
  const openStates = [];
  if(old){
    old.querySelectorAll('.exercise').forEach((elx, idx)=>{ openStates[idx] = elx.classList.contains('open'); });
  }
  const fresh = renderDay(dayKey);
  if(wasActive) fresh.classList.add('active');
  if(old){
    fresh.querySelectorAll('.exercise').forEach((elx, idx)=>{ if(openStates[idx]) elx.classList.add('open'); });
    old.replaceWith(fresh);
  }
  buildNav();
  markActiveTab(dayKey);
}

function markActiveTab(dayKey){
  document.querySelectorAll('.day-tab').forEach(t=> t.classList.toggle('active', t.dataset.day===dayKey));
}

function applyBranch(dk){
  const m = MIL[dk];
  document.body.dataset.branch = m.key;
  document.querySelector('.eyebrow').textContent = m.unit + ' · Weekly Discipline';
  document.querySelector('.sigil-divider').textContent = m.glyph + ' ' + m.glyph + ' ' + m.glyph;
}

function selectDay(dayKey){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const panel = document.querySelector(`.panel[data-day="${dayKey}"]`);
  if(panel) panel.classList.add('active');
  markActiveTab(dayKey);
  applyBranch(dayKey);
  localStorage.setItem('grimoire_last_day', dayKey);
}

function buildRestChecklist(){
  const restItems = DATA.sun.restItems;
  const restContainer = document.getElementById('restChecklist');
  if(!restContainer) return;
  restContainer.innerHTML = '';
  restItems.forEach((item, ri)=>{
    const done = isDone('sun','rest',item.name);
    const row = document.createElement('div');
    row.className = 'exercise' + (done?' done':'');
    row.innerHTML = `
      <div class="ex-row">
        <div class="checkbox">${done?'✓':''}</div>
        <div class="ex-name">${item.name}</div>
        <div class="expand-arrow">▶</div>
      </div>
      <div class="ex-details">
        <h4>The Briefing</h4>
        <p>${MIL.sun.lore[ri] || item.lore}</p>
        <h4>Recovery Note</h4>
        <p class="avoid" style="color:var(--ward-bright);">${item.tip}</p>
      </div>
    `;
    const checkbox = row.querySelector('.checkbox');
    const exRow = row.querySelector('.ex-row');

    checkbox.addEventListener('click', (e)=>{
      e.stopPropagation();
      toggleDone('sun','rest',item.name);
      const nowDone = isDone('sun','rest',item.name);
      row.classList.toggle('done', nowDone);
      checkbox.textContent = nowDone ? '✓' : '';
    });

    exRow.addEventListener('click', (e)=>{
      if(e.target === checkbox) return;
      row.classList.toggle('open');
    });

    restContainer.appendChild(row);
  });
}

function init(){
  buildNav();
  const panels = document.getElementById('panels');
  DAY_ORDER.forEach(dk=> panels.appendChild(renderDay(dk)));
  buildRestChecklist();

  const todaySlot = ['sun','mon','tue','wed','thu','fri','sat'][new Date().getDay()];
  let startDay = SCHEDULE[todaySlot];
  if(!DAY_ORDER.includes(startDay)) startDay = SCHEDULE.mon;
  selectDay(startDay);

  function updateSchedUI(){
    const b = document.getElementById('schedBtn'), n = document.getElementById('schedNote');
    if(schedMode==='ideal'){
      b.textContent = 'Back to Original Schedule';
      n.textContent = 'IDEAL SPLIT: Chest · Legs · Shoulders/Back/Abs · Arms · Arms · Benchmark';
    } else {
      b.textContent = 'Move to Ideal Schedule';
      n.textContent = 'CURRENT SPLIT: Arms · Chest · Shoulders/Back/Abs · Legs · Arms · Benchmark';
    }
  }
  updateSchedUI();
  document.getElementById('schedBtn').addEventListener('click', ()=>{
    schedMode = (schedMode==='ideal') ? 'original' : 'ideal';
    SCHEDULE = SCHEDULES[schedMode];
    try{ localStorage.setItem(SCHED_KEY, schedMode); }catch(e){}
    buildNav();
    const active = document.querySelector('.panel.active')?.dataset.day || SCHEDULE.mon;
    markActiveTab(active);
    updateSchedUI();
  });

  /* ---------- Backup & restore ---------- */
  const BACKUP_KEYS = [STORAGE_KEY, DIFF_KEY, LOG_KEY, CHAL_KEY, SCHED_KEY, HIST_KEY];
  const backupMsg = document.getElementById('backupMsg');
  const say = t => { backupMsg.textContent = t; };

  document.getElementById('exportBtn').addEventListener('click', ()=>{
    try{
      const data = {};
      BACKUP_KEYS.forEach(k=>{ const v = localStorage.getItem(k); if(v !== null) data[k] = v; });
      const payload = {app:'field-manual', version:1, exported:new Date().toISOString(), data};
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
      const d = new Date();
      const pad = n => String(n).padStart(2,'0');
      const name = `field-manual-backup-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=> URL.revokeObjectURL(a.href), 4000);
      say('Backup saved: ' + name);
    }catch(e){ say('Export failed. Try again.'); }
  });

  document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', (ev)=>{
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if(!file) return;
    const reader = new FileReader();
    reader.onerror = ()=> say('Could not read that file.');
    reader.onload = ()=>{
      let payload;
      try{ payload = JSON.parse(reader.result); }catch(e){ say('That file is not a valid backup.'); return; }
      if(!payload || payload.app !== 'field-manual' || typeof payload.data !== 'object' || !payload.data){
        say('That file is not a Field Manual backup.'); return;
      }
      if(!confirm('This replaces all current checkmarks, logs and settings with the backup. Continue?')) return;
      try{
        BACKUP_KEYS.forEach(k=>{
          if(typeof payload.data[k] === 'string') localStorage.setItem(k, payload.data[k]);
          else localStorage.removeItem(k);
        });
      }catch(e){ say('Could not write the backup into storage.'); return; }
      state = loadJSON(STORAGE_KEY, {});
      diffState = loadJSON(DIFF_KEY, {});
      chalState = loadJSON(CHAL_KEY, {});
      logState = loadJSON(LOG_KEY, {});
      histState = loadJSON(HIST_KEY, {});
      try{ schedMode = localStorage.getItem(SCHED_KEY)==='ideal' ? 'ideal' : 'original'; }catch(e){ schedMode = 'original'; }
      SCHEDULE = SCHEDULES[schedMode];
      const active = document.querySelector('.panel.active')?.dataset.day || SCHEDULE.mon;
      panels.innerHTML = '';
      DAY_ORDER.forEach(dk=> panels.appendChild(renderDay(dk)));
      buildRestChecklist();
      buildNav();
      selectDay(active);
      updateSchedUI();
      say('Backup restored.');
    };
    reader.readAsText(file);
  });

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    if(confirm('This will clear all checkmarks for every day and difficulty. Continue?')){
      state = {}; chalState = {}; saveChal();
      saveState();
      const active = document.querySelector('.day-tab.active')?.dataset.day || 'mon';
      panels.innerHTML = '';
      DAY_ORDER.forEach(dk=> panels.appendChild(renderDay(dk)));
      buildRestChecklist();
      selectDay(active);
    }
  });
}

init();
</script>
